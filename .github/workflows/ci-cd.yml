name: Canvas Co-Pilot CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: canvas-copilot
  ACR_NAME: canvascopilot

jobs:
  # ─── Job 1: Lint and Test ──────────────────────────────────────────────────────
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e "." pytest pytest-cov ruff

      - name: Lint with ruff
        run: ruff check canvas_copilot tests || true

      - name: Run unit tests with coverage
        run: pytest tests/ -v --tb=short --cov=canvas_copilot --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ─── Job 2: Build Docker Image ─────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Azure Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        continue-on-error: true

      - name: Push image to ACR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ─── Job 3: Deploy to AKS ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: true

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group canvas-copilot-rg --name canvas-copilot-aks --overwrite-existing || true
        continue-on-error: true

      - name: Deploy k8s manifests
        run: |
          kubectl apply -f k8s/namespace.yaml || true
          kubectl apply -f k8s/configmap.yaml -n canvas-copilot || true
          kubectl apply -f k8s/redis-deployment.yaml -n canvas-copilot || true
          kubectl apply -f k8s/chromadb-deployment.yaml -n canvas-copilot || true
          kubectl apply -f k8s/app-deployment.yaml -n canvas-copilot || true
        continue-on-error: true

      - name: Update deployment image
        run: |
          kubectl set image deployment/canvas-copilot-app app=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} -n canvas-copilot || true
          kubectl rollout status deployment/canvas-copilot-app -n canvas-copilot --timeout=120s || true
        continue-on-error: true

      - name: Verify deployment
        run: kubectl get pods -n canvas-copilot || true
        continue-on-error: true
