[project]
name = "canvas-copilot"
version = "2.0.0"
description = "Multi-agent AI assistant for Canvas LMS with FastAPI, LangGraph, Redis caching, and ChromaDB vector retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
ai = [
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "anthropic>=0.28.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "redis>=5.0.0",
    "pydantic>=2.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
canvas-copilot = "canvas_copilot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canvas_copilot*"]

[tool.setuptools.package-data]
canvas_copilot = ["templates/*.html", "static/*.css"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
