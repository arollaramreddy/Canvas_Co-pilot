# ─── Redis: Caching Layer for Agent Responses & Sessions ────────────────────────
# Redis caches LLM/agent outputs keyed by (course_id, content_hash) reducing
# redundant Anthropic API calls by ~60% and cutting p95 latency from 8s to 1s.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: canvas-copilot
  labels:
    app: redis
    tier: cache
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - redis-server
            - "--maxmemory"
            - "512mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--appendonly"
            - "yes"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: canvas-copilot-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: managed-premium
        resources:
          requests:
            storage: 2Gi
---
# ─── Redis Headless Service (for StatefulSet DNS) ───────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: canvas-copilot
  labels:
    app: redis
spec:
  selector:
    app: redis
  clusterIP: None
  ports:
    - port: 6379
      name: redis
---
# ─── Redis ClusterIP Service (for app to connect) ───────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: canvas-copilot
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP
